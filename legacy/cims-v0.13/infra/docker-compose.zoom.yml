services:
  cims-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../.env
    environment:
      CIMS_PROVIDER_BASE_URL: http://zoom-video-provider:4200
      CIMS_PROVIDER_CODE: ZOOM
      CIMS_WEBHOOK_URL: http://cims-api:4000/api/v1/provider-webhooks/video
    volumes:
      - cims_api_data:/data
    ports:
      - "4000:4000"
    depends_on:
      zoom-video-provider:
        condition: service_healthy
  zoom-video-provider:
    build:
      context: ..
      dockerfile: services/zoom-video-provider/Dockerfile
    env_file: ../.env
    environment:
      ZOOM_ADAPTER_PORT: 4200
      CIMS_WEBHOOK_URL: http://cims-api:4000/api/v1/provider-webhooks/video
    volumes:
      - zoom_adapter_data:/data
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4200/health"]
      interval: 10s
      timeout: 3s
      retries: 6
volumes:
  cims_api_data: {}
  zoom_adapter_data: {}
