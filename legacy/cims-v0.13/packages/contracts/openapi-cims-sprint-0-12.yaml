openapi: 3.1.0
info:
  title: CIMS API Sprint 0-12
  version: 0.12.0
  description: >-
    Development and pilot-UAT contract for electronic criminal-hearing coordination.
    CIMS stores operational references and evidence, but does not replace official court
    information systems, judicial authority, or legally prescribed documents.
servers:
  - url: http://localhost:4000/api/v1
security:
  - bearerAuth: []
paths:
  /appeal-decision-readings:
    post:
      summary: Schedule an appellate decision reading
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppealReading' }
      responses:
        '201': { description: Decision reading scheduled }
        '409': { description: Active reading already exists }
  /appeal-decision-readings/{readingId}:
    get:
      summary: Read appellate decision workflow and compliance status
      parameters: [{ $ref: '#/components/parameters/ReadingId' }]
      responses:
        '200': { description: Reading workflow }
  /appeal-decision-readings/{readingId}:reschedule:
    post:
      summary: Supersede an active reading and create a new version
      parameters:
        [
          { $ref: '#/components/parameters/ReadingId' },
          { $ref: '#/components/parameters/IdempotencyKey' }
        ]
      responses:
        '201': { description: New reading version }
  /appeal-decision-readings/{readingId}/notices:
    post:
      summary: Record one step of the inter-institution notice chain
      parameters:
        [
          { $ref: '#/components/parameters/ReadingId' },
          { $ref: '#/components/parameters/IdempotencyKey' }
        ]
      responses:
        '201': { description: Notice evidence recorded }
  /appeal-decision-readings/{readingId}/presence:
    post:
      summary: Record presence or absence of defendant, prosecutor, or advocate
      parameters:
        [
          { $ref: '#/components/parameters/ReadingId' },
          { $ref: '#/components/parameters/IdempotencyKey' }
        ]
      responses:
        '201': { description: Presence evidence recorded }
  /appeal-decision-readings/{readingId}:complete:
    post:
      summary: Record reading in an open hearing and calculate the 14-day cassation deadline
      parameters:
        [
          { $ref: '#/components/parameters/ReadingId' },
          { $ref: '#/components/parameters/IdempotencyKey' }
        ]
      responses:
        '200': { description: Reading completed }
        '409': { description: Presence or public-hearing evidence missing }
  /appeal-decision-readings/{readingId}/excerpt:
    post:
      summary: Record same-day excerpt publication in the official information system
      parameters:
        [
          { $ref: '#/components/parameters/ReadingId' },
          { $ref: '#/components/parameters/IdempotencyKey' }
        ]
      responses:
        '201': { description: Publication evidence }
  /appeal-decision-readings/{readingId}/transmission:
    post:
      summary: Record transmission of the decision and case file to the first-instance court
      parameters:
        [
          { $ref: '#/components/parameters/ReadingId' },
          { $ref: '#/components/parameters/IdempotencyKey' }
        ]
      responses:
        '201': { description: Seven-day compliance evidence }
  /compliance-dashboard:
    get:
      summary: Read operational, appellate, incident, reconciliation, and audit KPIs
      responses:
        '200': { description: Compliance dashboard }
  /reconciliation-runs:
    get:
      summary: List reconciliation runs
      responses:
        '200': { description: Reconciliation runs }
    post:
      summary: Reconcile CIMS case references against an official source snapshot
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconciliationRequest' }
      responses:
        '201': { description: Completed reconciliation run }
  /reconciliation-runs/{runId}:
    get:
      summary: Read reconciliation evidence and differences
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200': { description: Reconciliation result }
  /audit-events/verify-chain:
    get:
      summary: Verify the SHA-256 hash chain of append-only audit events
      responses:
        '200': { description: Audit-chain verification result }
  /security-events:
    get:
      summary: List append-only security events
      responses:
        '200': { description: Security event list }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ReadingId: { name: readingId, in: path, required: true, schema: { type: string, format: uuid } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 16, maxLength: 128 }
      }
  schemas:
    CreateAppealReading:
      type: object
      required: [case_reference_id, scheduled_at, delivery_mode, determination_reference]
      properties:
        case_reference_id: { type: string, format: uuid }
        scheduled_at: { type: string, format: date-time }
        display_timezone: { type: string, default: Asia/Jakarta }
        delivery_mode: { type: string, enum: [DIRECT, ELECTRONIC, HYBRID] }
        determination_reference: { type: string }
        virtual_session_reference: { type: [string, 'null'] }
    ReconciliationRequest:
      type: object
      required: [source_system_code, records]
      properties:
        source_system_code: { type: string }
        records:
          type: array
          minItems: 1
          items:
            type: object
            required: [external_case_id]
            properties:
              external_case_id: { type: string }
              case_number: { type: string }
              case_type: { type: [string, 'null'] }
              source_hash: { type: [string, 'null'] }
