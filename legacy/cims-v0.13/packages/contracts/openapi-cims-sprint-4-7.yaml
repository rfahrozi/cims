openapi: 3.1.0
info: {title: CIMS API Sprint 4-7, version: 0.7.0}
servers: [{url: http://localhost:4000/api/v1}]
security: [{bearerAuth: []}]
paths:
  /hearings/{hearingId}/notices:
    post: {summary: Create official notice, parameters: [{$ref: '#/components/parameters/HearingId'}], responses: {'201': {description: Created}}}
    get: {summary: List notices, parameters: [{$ref: '#/components/parameters/HearingId'}], responses: {'200': {description: OK}}}
  /notices/{noticeId}:send:
    post: {summary: Deliver notice and store evidence, parameters: [{$ref: '#/components/parameters/NoticeId'}], responses: {'200': {description: Sent}}}
  /notices/{noticeId}:acknowledge:
    post: {summary: Acknowledge delivered notice, parameters: [{$ref: '#/components/parameters/NoticeId'}], responses: {'200': {description: Acknowledged}}}
  /hearings/{hearingId}/identity-verifications:
    post: {summary: Record identity verification, parameters: [{$ref: '#/components/parameters/HearingId'}], responses: {'201': {description: Created}}}
  /hearings/{hearingId}/room-inspections:
    post: {summary: Record room inspection, parameters: [{$ref: '#/components/parameters/HearingId'}], responses: {'201': {description: Created}}}
  /hearings/{hearingId}/readiness-submissions:
    post: {summary: Submit institutional readiness, parameters: [{$ref: '#/components/parameters/HearingId'}], responses: {'201': {description: Created}, '409': {description: Gate not met}}}
  /hearings/{hearingId}/readiness:
    get: {summary: Get readiness status, parameters: [{$ref: '#/components/parameters/HearingId'}], responses: {'200': {description: OK}}}
  /hearings/{hearingId}/virtual-session:provision:
    post: {summary: Provision provider-neutral virtual session, parameters: [{$ref: '#/components/parameters/HearingId'}], responses: {'201': {description: Ready}, '409': {description: Gate not met}, '503': {description: Provider unavailable}}}
  /hearings/{hearingId}/virtual-session:
    get: {summary: Get virtual session, parameters: [{$ref: '#/components/parameters/HearingId'}], responses: {'200': {description: OK}}}
  /provider-webhooks/video:
    post: {security: [], summary: Receive signed provider event, responses: {'202': {description: Accepted}, '401': {description: Invalid signature}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  parameters:
    HearingId: {name: hearingId, in: path, required: true, schema: {type: string, format: uuid}}
    NoticeId: {name: noticeId, in: path, required: true, schema: {type: string, format: uuid}}
