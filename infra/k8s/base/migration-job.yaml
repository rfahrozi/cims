apiVersion: batch/v1
kind: Job
metadata: { name: cims-schema-migration }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { app: cims-schema-migration } }
    spec:
      restartPolicy: Never
      serviceAccountName: cims-migration
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: registry.example/cims/migrations:0.17.0
          envFrom: [{ secretRef: { name: cims-migration-secrets } }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
