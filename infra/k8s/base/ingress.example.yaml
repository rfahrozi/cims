apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cims
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '60'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [cims.example]
      secretName: cims-tls
  rules:
    - host: cims.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: cims-api, port: { name: http } } }
          - path: /health
            pathType: Prefix
            backend: { service: { name: cims-api, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: cims-web, port: { name: http } } }
