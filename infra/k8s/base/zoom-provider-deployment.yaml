apiVersion: v1
kind: ConfigMap
metadata: { name: cims-zoom-provider-config, namespace: video-provider }
data:
  NODE_ENV: production
  ZOOM_PROVIDER_PORT: '3010'
  ZOOM_API_TIMEOUT_MS: '15000'
  ZOOM_DB_POOL_MAX: '3'
  ZOOM_DB_CONNECT_TIMEOUT_MS: '5000'
  ZOOM_DB_STATEMENT_TIMEOUT_MS: '20000'
  TRUST_PROXY: 'true'
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: zoom-provider, namespace: video-provider, labels: { app: zoom-provider } }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: zoom-provider } }
  template:
    metadata: { labels: { app: zoom-provider } }
    spec:
      serviceAccountName: cims-zoom-provider
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: zoom-provider
          image: registry.example/cims/zoom-provider:0.19.0
          ports: [{ name: http, containerPort: 3010 }]
          envFrom:
            - { configMapRef: { name: cims-zoom-provider-config } }
            - { secretRef: { name: cims-zoom-provider-secrets } }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 15, failureThreshold: 3 }
          livenessProbe: { tcpSocket: { port: http }, periodSeconds: 20, failureThreshold: 3 }
          startupProbe: { tcpSocket: { port: http }, periodSeconds: 5, failureThreshold: 30 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 750m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: zoom-provider, namespace: video-provider }
spec:
  selector: { app: zoom-provider }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: zoom-provider-pdb, namespace: video-provider }
spec: { minAvailable: 1, selector: { matchLabels: { app: zoom-provider } } }
