apiVersion: v1
kind: ResourceQuota
metadata:
  name: cims-runtime-quota
spec:
  hard:
    requests.cpu: '4'
    requests.memory: 8Gi
    limits.cpu: '12'
    limits.memory: 20Gi
    pods: '40'
    persistentvolumeclaims: '8'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cims-runtime-limits
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: '1'
        memory: 1Gi
      max:
        cpu: '4'
        memory: 4Gi
      min:
        cpu: 25m
        memory: 64Mi
