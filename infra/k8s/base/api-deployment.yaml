
apiVersion: apps/v1
kind: Deployment
metadata: { name: cims-api, labels: { app: cims-api } }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: cims-api } }
  template:
    metadata: { labels: { app: cims-api } }
    spec:
      serviceAccountName: cims-api
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: registry.example/cims/api:0.19.0
          ports: [{ name: http, containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: cims-api-config } }, { secretRef: { name: cims-api-secrets } }]
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 10, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 20, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 5, failureThreshold: 30 }
          resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { cpu: '1', memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: cims-api, labels: { app: cims-api } }
spec: { selector: { app: cims-api }, ports: [{ name: http, port: 80, targetPort: http }] }
