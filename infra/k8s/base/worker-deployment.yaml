apiVersion: apps/v1
kind: Deployment
metadata: { name: cims-worker, labels: { app: cims-worker } }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: cims-worker } }
  template:
    metadata: { labels: { app: cims-worker } }
    spec:
      serviceAccountName: cims-worker
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: registry.example/cims/worker:0.19.0
          envFrom:
            - { configMapRef: { name: cims-worker-config } }
            - { secretRef: { name: cims-worker-secrets } }
          resources: { requests: { cpu: 150m, memory: 256Mi }, limits: { cpu: '1', memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: cims-worker-pdb }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: cims-worker } }
