services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cims
      POSTGRES_USER: cims
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [cims_pgdata:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, 'pg_isready -U cims -d cims'], interval: 10s, timeout: 5s, retries: 10 }
    networks: [data]
    security_opt: [no-new-privileges:true]

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      CIMS_PROCESS_ROLE: API
      AUTH_MODE: OIDC
      DATABASE_URL_FILE: /run/secrets/database_url
      TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      FIELD_ENCRYPTION_KEY_FILE: /run/secrets/field_encryption_key
      AUDIT_HASH_KEY_FILE: /run/secrets/audit_hash_key
      WEBHOOK_SHARED_SECRET_FILE: /run/secrets/webhook_shared_secret
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: cims-api
      OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      WEB_ORIGINS: ${WEB_ORIGINS}
      PERSISTENCE_MODE: POSTGRES
      DB_SSL: 'true'
      OUTBOX_WORKER_ENABLED: 'false'
      RETENTION_EXECUTION_ENABLED: 'false'
      LEGAL_HOLD_MAKER_CHECKER: 'true'
      EVIDENCE_STORAGE_MODE: HTTP
      EVIDENCE_STORAGE_URL: ${EVIDENCE_STORAGE_URL}
      EVIDENCE_STORAGE_API_KEY_FILE: /run/secrets/evidence_storage_api_key
      VIDEO_PROVIDER_MODE: HTTP
      VIDEO_PROVIDER_URL: http://zoom-provider:3010
      SWAGGER_ENABLED: 'false'
      TRUST_PROXY: 'true'
    secrets: [database_url, token_pepper, field_encryption_key, audit_hash_key, webhook_shared_secret, evidence_storage_api_key]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [edge, data, provider]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  worker:
    build: { context: .., dockerfile: apps/worker.Dockerfile }
    environment:
      NODE_ENV: production
      CIMS_PROCESS_ROLE: WORKER
      DATABASE_URL_FILE: /run/secrets/database_url
      TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      FIELD_ENCRYPTION_KEY_FILE: /run/secrets/field_encryption_key
      AUDIT_HASH_KEY_FILE: /run/secrets/audit_hash_key
      NOTIFICATION_GATEWAY_API_KEY_FILE: /run/secrets/notification_gateway_api_key
      OFFICIAL_SYSTEM_GATEWAY_API_KEY_FILE: /run/secrets/official_system_gateway_api_key
      PERSISTENCE_MODE: POSTGRES
      DB_SSL: 'true'
      OUTBOX_WORKER_ENABLED: 'true'
      RETENTION_EXECUTION_ENABLED: 'false'
      LEGAL_HOLD_MAKER_CHECKER: 'true'
      EVIDENCE_STORAGE_MODE: HTTP
      EVIDENCE_STORAGE_URL: ${EVIDENCE_STORAGE_URL}
      EVIDENCE_STORAGE_API_KEY_FILE: /run/secrets/evidence_storage_api_key
      NOTIFICATION_GATEWAY_MODE: ${NOTIFICATION_GATEWAY_MODE:-MOCK}
      NOTIFICATION_GATEWAY_URL: ${NOTIFICATION_GATEWAY_URL:-}
      OFFICIAL_SYSTEM_GATEWAY_MODE: ${OFFICIAL_SYSTEM_GATEWAY_MODE:-MOCK}
      OFFICIAL_SYSTEM_GATEWAY_URL: ${OFFICIAL_SYSTEM_GATEWAY_URL:-}
      VIDEO_PROVIDER_MODE: HTTP
      VIDEO_PROVIDER_URL: http://zoom-provider:3010
    secrets: [database_url, token_pepper, field_encryption_key, audit_hash_key, notification_gateway_api_key, official_system_gateway_api_key, evidence_storage_api_key]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [edge, data, provider]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    networks: [edge]
    read_only: true
    security_opt: [no-new-privileges:true]

  zoom-provider:
    build: { context: .., dockerfile: services/zoom-provider/Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      ZOOM_ACCOUNT_ID_FILE: /run/secrets/zoom_account_id
      ZOOM_CLIENT_ID_FILE: /run/secrets/zoom_client_id
      ZOOM_CLIENT_SECRET_FILE: /run/secrets/zoom_client_secret
      ZOOM_HOST_USER_ID_FILE: /run/secrets/zoom_host_user_id
      ZOOM_API_TIMEOUT_MS: '15000'
      TRUST_PROXY: 'true'
    secrets: [database_url, zoom_account_id, zoom_client_id, zoom_client_secret, zoom_host_user_id]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [data, provider]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

secrets:
  postgres_password: { file: ./secrets/postgres_password.txt }
  database_url: { file: ./secrets/database_url.txt }
  token_pepper: { file: ./secrets/token_pepper.txt }
  field_encryption_key: { file: ./secrets/field_encryption_key.txt }
  audit_hash_key: { file: ./secrets/audit_hash_key.txt }
  webhook_shared_secret: { file: ./secrets/webhook_shared_secret.txt }
  notification_gateway_api_key: { file: ./secrets/notification_gateway_api_key.txt }
  official_system_gateway_api_key: { file: ./secrets/official_system_gateway_api_key.txt }
  evidence_storage_api_key: { file: ./secrets/evidence_storage_api_key.txt }
  zoom_account_id: { file: ./secrets/zoom_account_id.txt }
  zoom_client_id: { file: ./secrets/zoom_client_id.txt }
  zoom_client_secret: { file: ./secrets/zoom_client_secret.txt }
  zoom_host_user_id: { file: ./secrets/zoom_host_user_id.txt }

networks:
  edge: {}
  data: { internal: true }
  provider: { internal: true }
volumes:
  cims_pgdata: {}
