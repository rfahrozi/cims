version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-cims_prod_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-replace_this_password}
      POSTGRES_DB: ${DB_NAME:-cims_prod}
    ports:
      - '5433:5432' # Bind to 5433 on VPS to avoid conflicts
    volumes:
      - cims_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-cims_prod_user}']
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: tools/Dockerfile.migrations
    environment:
      DATABASE_URL: postgres://${DB_USER:-cims_prod_user}:${DB_PASSWORD:-replace_this_password}@db:5432/${DB_NAME:-cims_prod}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      AUTH_MODE: OIDC
      OIDC_ISSUER: ${OIDC_ISSUER:-https://sso.pt-kepri.go.id/auth/realms/cims}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-https://sso.pt-kepri.go.id/auth/realms/cims/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-cims-api}
      DATABASE_URL: postgres://${DB_USER:-cims_prod_user}:${DB_PASSWORD:-replace_this_password}@db:5432/${DB_NAME:-cims_prod}?sslmode=require
      PERSISTENCE_MODE: POSTGRES
      DB_SSL: 'true'
      WEB_ORIGINS: https://devapps.pt-kepri.go.id
      API_PORT: 3000
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:-dummy_webhook_secret_must_be_32_characters_long}
      TOKEN_PEPPER: ${TOKEN_PEPPER:-dummy_token_pepper_must_be_32_characters_long}
      AUDIT_HASH_KEY: ${AUDIT_HASH_KEY:-dummy_audit_hash_key_must_be_32_characters_long}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=}
      NOTIFICATION_GATEWAY_MODE: API
      NOTIFICATION_GATEWAY_URL: http://brevo-notification:3011
      NOTIFICATION_GATEWAY_API_KEY: ${NOTIFICATION_GATEWAY_API_KEY:-internal_auth_key}
      OFFICIAL_SYSTEM_GATEWAY_MODE: API
      OFFICIAL_SYSTEM_GATEWAY_URL: ${OFFICIAL_SYSTEM_GATEWAY_URL:-http://mock.internal}
      OFFICIAL_SYSTEM_GATEWAY_API_KEY: ${OFFICIAL_SYSTEM_GATEWAY_API_KEY:-internal_auth_key}
      VIDEO_PROVIDER_MODE: HTTP
      VIDEO_PROVIDER_URL: http://zoom-provider:3010
      EVIDENCE_STORAGE_MODE: S3
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3.amazonaws.com}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dummy_access_key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dummy_secret_key}
      OUTBOX_WORKER_ENABLED: 'false'
      SWAGGER_ENABLED: 'false'
      ENABLE_LEGACY_PROXY: 'false'
      KMS_ENABLED: ${KMS_ENABLED:-false}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
    ports:
      - '127.0.0.1:4001:3000' # Expose to localhost 4001 for Nginx Reverse Proxy
    depends_on:
      migrations:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      VITE_API_BASE_URL: https://devapps.pt-kepri.go.id/cims/api/v1
    ports:
      - '127.0.0.1:4000:8080' # Nginx runs on 8080 inside container
    depends_on:
      api:
        condition: service_healthy

  zoom-provider:
    build:
      context: .
      dockerfile: services/zoom-provider/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3010
      CIMS_API_URL: http://api:3000
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:-dummy_account_id}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-dummy_client_id}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-dummy_client_secret}
      ZOOM_WEBHOOK_SECRET: ${ZOOM_WEBHOOK_SECRET:-dummy_webhook_secret}
      CIMS_INTERNAL_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:-dummy_webhook_secret_must_be_32_characters_long}
    ports:
      - '127.0.0.1:4002:3010' # Webhook ingestion endpoint for external access if needed

  brevo-notification:
    build:
      context: .
      dockerfile: services/brevo-notification/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3011
      DATABASE_URL: postgres://${DB_USER:-cims_prod_user}:${DB_PASSWORD:-replace_this_password}@db:5432/${DB_NAME:-cims_prod}?sslmode=require
      BREVO_API_KEY: ${BREVO_API_KEY:-dummy_brevo_api_key}
    depends_on:
      migrations:
        condition: service_completed_successfully

volumes:
  cims_pgdata_prod:
