name: Production Deployment Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck & Linter
        run: |
          npm run typecheck -ws --if-present
          npm run format:check

      - name: Run Unit Tests
        run: npm run test -ws --if-present

  deploy:
    name: Deploy to Server
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Script
        run: |
          echo "Memulai proses rollout container CIMS..."
          # script untuk restart docker production di server

  smoke-test:
    name: Post-Deploy Smoke Test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify Live Endpoint
        run: |
          echo "Memastikan aplikasi dapat diakses..."
          curl -f -s -o /dev/null http://localhost/api/v1/health/live || exit 1

      - name: Verify DB Readiness
        run: |
          echo "Memeriksa kesiapan basis data (DB_SSL, dll)..."
          curl -f -s -o /dev/null http://localhost/api/v1/health/ready || exit 1

  rollback:
    name: Rollback On Failure
    needs: smoke-test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Rollback Script
        run: |
          echo "Smoke test gagal! Menjalankan rollback otomatis ke tag sebelumnya..."
