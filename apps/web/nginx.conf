worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Ketika Vite build dengan base=/cims/, semua aset akan diminta dari /cims/assets/...
    # Kita tidak punya folder /cims di dalam container, filenya langsung ada di /usr/share/nginx/html/assets
    # Jadi kita arahkan Nginx agar request ke /cims mencari file di root tersebut
    location /cims/ {
      alias /usr/share/nginx/html/;
      try_files $uri $uri/ /cims/index.html;
    }
    
    # Tangani fallback jika react-router mengubah URL menjadi format tanpa ekstensi
    # Alias dan try_files sering bentrok untuk SPA, trik yang aman:
    location ^~ /cims/assets/ {
      alias /usr/share/nginx/html/assets/;
    }

    # Root fallback
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }
  }
}
