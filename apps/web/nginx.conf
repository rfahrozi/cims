worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Support untuk subdirektori /cims/
    location /cims/ {
      alias /usr/share/nginx/html/;
      try_files $uri $uri/ /cims/index.html;
    }
    
    # Fallback untuk route root ke cims
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

    # Proxy API dipindahkan ke konfigurasi nginx host utama (di VPS),
    # tapi kita simpan konfigurasi ini agar tetap berfungsi di lingkungan Docker standalone

    # Liveness probe untuk kontainer UI
    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }
  }
}
