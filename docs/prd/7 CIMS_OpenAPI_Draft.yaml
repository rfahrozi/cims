openapi: 3.0.3
info:
  title: CIMS API
  version: 1.0.0-draft
  description: Draft OpenAPI untuk CIMS v1.0 meliputi case intake, determination, scheduling, notification acknowledgment, readiness, session, hearing control, incident, dan reporting.
servers:
  - url: https://api.cims.local/api/v1
    description: Local/Staging
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Cases
  - name: Determinations
  - name: Schedules
  - name: Notifications
  - name: Readiness
  - name: Sessions
  - name: Hearings
  - name: Incidents
  - name: Reports
paths:
  /me:
    get:
      tags: [Auth]
      summary: Profil pengguna aktif
      responses:
        '200':
          description: Profil user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
  /cases:
    get:
      tags: [Cases]
      summary: Daftar perkara
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Daftar perkara
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
    post:
      tags: [Cases]
      summary: Buat referensi perkara
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: Perkara dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '409':
          $ref: '#/components/responses/Conflict'
  /cases/{caseId}:
    get:
      tags: [Cases]
      summary: Detail perkara
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Detail perkara
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Cases]
      summary: Update terbatas referensi perkara
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCaseRequest'
      responses:
        '200':
          description: Perkara diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
  /cases/{caseId}/determinations:
    post:
      tags: [Determinations]
      summary: Catat referensi penetapan
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeterminationRequest'
      responses:
        '201':
          description: Penetapan dicatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Determination'
  /hearings/schedules:
    post:
      tags: [Schedules]
      summary: Buat jadwal sidang
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: Jadwal dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '409':
          $ref: '#/components/responses/Conflict'
  /hearings/schedules/{scheduleId}:
    patch:
      tags: [Schedules]
      summary: Ubah jadwal sidang
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
      responses:
        '200':
          description: Jadwal diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
  /hearings/schedules/{scheduleId}/cancel:
    post:
      tags: [Schedules]
      summary: Batalkan jadwal sidang
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Jadwal dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
  /notifications/{notificationId}/ack:
    post:
      tags: [Notifications]
      summary: Acknowledgment notifikasi
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '200':
          description: Acknowledgment tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acknowledgment'
  /hearings/{hearingId}/readiness:
    get:
      tags: [Readiness]
      summary: Detail readiness checklist
      parameters:
        - $ref: '#/components/parameters/HearingId'
      responses:
        '200':
          description: Checklist readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessChecklist'
    put:
      tags: [Readiness]
      summary: Simpan atau update checklist readiness
      parameters:
        - $ref: '#/components/parameters/HearingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReadinessRequest'
      responses:
        '200':
          description: Readiness diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessChecklist'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /hearings/{hearingId}/session/create:
    post:
      tags: [Sessions]
      summary: Buat meeting provider
      parameters:
        - $ref: '#/components/parameters/HearingId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  example: zoom
      responses:
        '201':
          description: Session dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HearingSession'
        '409':
          description: Hard gate belum terpenuhi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /hearings/{hearingId}/session:
    get:
      tags: [Sessions]
      summary: Detail session provider
      parameters:
        - $ref: '#/components/parameters/HearingId'
      responses:
        '200':
          description: Detail session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HearingSession'
  /hearings/{hearingId}/status:
    post:
      tags: [Hearings]
      summary: Update status sidang
      parameters:
        - $ref: '#/components/parameters/HearingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum:
                    [
                      READY,
                      IN_PROGRESS,
                      SUSPENDED,
                      POSTPONED,
                      COMPLETED,
                      DOCUMENTATION_PENDING,
                      CLOSED
                    ]
                reason:
                  type: string
      responses:
        '200':
          description: Status sidang diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HearingStatusResponse'
  /incidents:
    post:
      tags: [Incidents]
      summary: Catat insiden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentRequest'
      responses:
        '201':
          description: Insiden tercatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
  /reports/kpi:
    get:
      tags: [Reports]
      summary: Ambil KPI dashboard
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: KPI dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiDashboard'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string }
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { type: string }
    HearingId:
      name: hearingId
      in: path
      required: true
      schema: { type: string }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Konflik data atau rule bisnis
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Validasi bisnis gagal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CurrentUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        organizationId: { type: string }
        roles:
          type: array
          items: { type: string }
    Case:
      type: object
      properties:
        id: { type: string }
        caseNumber: { type: string }
        caseType: { type: string }
        organizationId: { type: string }
        status: { type: string }
        sourceSystem: { type: string }
    CaseDetail:
      allOf:
        - $ref: '#/components/schemas/Case'
        - type: object
          properties:
            participants:
              type: array
              items:
                $ref: '#/components/schemas/Participant'
            latestDetermination:
              $ref: '#/components/schemas/Determination'
    CaseListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Case'
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    Participant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        organization: { type: string }
    CreateCaseRequest:
      type: object
      required: [caseNumber, caseType, organizationId]
      properties:
        caseNumber: { type: string }
        caseType: { type: string }
        organizationId: { type: string }
        sourceSystem: { type: string }
    UpdateCaseRequest:
      type: object
      properties:
        status: { type: string }
        sourceSystem: { type: string }
    Determination:
      type: object
      properties:
        id: { type: string }
        caseId: { type: string }
        determinationNumber: { type: string }
        determinationDate: { type: string, format: date }
        hearingMode: { type: string }
        validityStatus: { type: string, enum: [DRAFT, VERIFIED, VALID] }
        documentHash: { type: string }
    CreateDeterminationRequest:
      type: object
      required: [determinationNumber, determinationDate, hearingMode]
      properties:
        determinationNumber: { type: string }
        determinationDate: { type: string, format: date }
        hearingMode: { type: string, example: ELECTRONIC }
        reason: { type: string }
        documentHash: { type: string }
        documentRef: { type: string }
    Schedule:
      type: object
      properties:
        id: { type: string }
        caseId: { type: string }
        agenda: { type: string }
        date: { type: string, format: date }
        startTime: { type: string, example: '09:00' }
        durationMinutes: { type: integer }
        status: { type: string }
        conflictStatus: { type: string }
    CreateScheduleRequest:
      type: object
      required: [caseId, agenda, date, startTime, durationMinutes]
      properties:
        caseId: { type: string }
        agenda: { type: string }
        date: { type: string, format: date }
        startTime: { type: string }
        durationMinutes: { type: integer }
        judgeIds:
          type: array
          items: { type: string }
        clerkId: { type: string }
        virtualRoomType: { type: string, example: zoom }
    UpdateScheduleRequest:
      type: object
      properties:
        agenda: { type: string }
        date: { type: string, format: date }
        startTime: { type: string }
        durationMinutes: { type: integer }
        reason: { type: string }
    Acknowledgment:
      type: object
      properties:
        id: { type: string }
        notificationId: { type: string }
        actorId: { type: string }
        acknowledgedAt: { type: string, format: date-time }
        note: { type: string }
    ReadinessChecklist:
      type: object
      properties:
        hearingId: { type: string }
        status: { type: string, enum: [NOT_READY, PARTIAL, READY] }
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessItem'
    ReadinessItem:
      type: object
      properties:
        code: { type: string }
        label: { type: string }
        mandatory: { type: boolean }
        status: { type: string, enum: [PENDING, PASSED, FAILED, NOT_APPLICABLE] }
        verifierId: { type: string }
        verifiedAt: { type: string, format: date-time }
        note: { type: string }
    UpdateReadinessRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessItem'
    HearingSession:
      type: object
      properties:
        id: { type: string }
        hearingId: { type: string }
        provider: { type: string }
        meetingId: { type: string }
        joinUrl: { type: string }
        hostUrl: { type: string }
        passcode: { type: string }
        status: { type: string, enum: [SCHEDULED, LIVE, ENDED, CANCELED, FAILED] }
    HearingStatusResponse:
      type: object
      properties:
        hearingId: { type: string }
        status: { type: string }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
    CreateIncidentRequest:
      type: object
      required: [category, severity, occurredAt, summary]
      properties:
        hearingId: { type: string }
        category: { type: string, enum: [TECHNICAL, CYBER, FORCE_MAJEURE, OTHER] }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        occurredAt: { type: string, format: date-time }
        summary: { type: string }
        impact: { type: string }
        actionTaken: { type: string }
    Incident:
      type: object
      properties:
        id: { type: string }
        hearingId: { type: string }
        category: { type: string }
        severity: { type: string }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        occurredAt: { type: string, format: date-time }
        summary: { type: string }
    KpiDashboard:
      type: object
      properties:
        period:
          type: object
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        metrics:
          type: object
          properties:
            notificationSuccessRate: { type: number, format: float }
            acknowledgmentOnTimeRate: { type: number, format: float }
            readinessOnTimeRate: { type: number, format: float }
            hearingStartOnTimeRate: { type: number, format: float }
            technicalIncidentCount: { type: integer }
            cyberIncidentCount: { type: integer }
    ErrorResponse:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
        details:
          type: array
          items: { type: string }
