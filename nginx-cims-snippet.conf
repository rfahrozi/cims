    # ==========================================================
    # ROUTING API DAN BACKEND CIMS
    # ==========================================================
    
    # Routing Backend API CIMS
    location /cims/api/ {
        proxy_pass http://127.0.0.1:4001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE optimization (Penting untuk notifikasi real-time CIMS)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # ==========================================================
    # ROUTING FRONTEND CIMS (React SPA)
    # ==========================================================
    
    location = /cims {
        return 301 /cims/;
    }
    
    location /cims/ {
        # proxy_pass ke port Nginx di dalam container web
        proxy_pass http://127.0.0.1:4000/cims/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
